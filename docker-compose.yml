version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: guideme_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: guideme_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: guideme_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/guideme_db
      - DATABASE_URL_SYNC=postgresql://postgres:postgrespassword@db:5432/guideme_db
      - DATABASE_FALLBACK_SQLITE=False
      - SECRET_KEY=production-secure-32-byte-key-change-this-now-guideme-2026
      - AI_PROVIDER=mock
      - WEARABLE_PROVIDER=mock
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: guideme_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
